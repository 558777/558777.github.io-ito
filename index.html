<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICQ Multi-AI Chat Room</title>
    <style>
        body { margin: 0; background: #040d1a; color: #00ff00; font-family: "Courier New", monospace; display: flex; flex-direction: column; height: 100vh; }
        #icq-header { background: #020813; border-bottom: 2px solid #00ff00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        #icq-room { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 16px; border-radius: 4px; max-width: 85%; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .principal { background: #002244; color: #ffffff; border-left: 4px solid #0088ff; align-self: flex-end; }
        .ai-gemini { background: #0b1d12; color: #a3e635; border-left: 4px solid #22c55e; align-self: flex-start; }
        .ai-llama { background: #1c1917; color: #fb923c; border-left: 4px solid #ea580c; align-self: flex-start; }
        .sys-msg { background: transparent; color: #64748b; align-self: center; font-size: 12px; }
        #icq-controls { background: #020813; border-top: 2px solid #1e293b; padding: 15px 20px; display: flex; gap: 15px; }
        textarea { flex: 1; height: 44px; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; resize: none; font-family: inherit; font-size: 15px; }
        textarea:focus { outline: none; box-shadow: 0 0 10px #00ff00; }
        button { background: #00ff00; color: #000; border: none; font-weight: bold; padding: 0 25px; cursor: pointer; font-family: inherit; text-transform: uppercase; }
        button:hover { background: #33ff33; box-shadow: 0 0 10px #00ff00; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }
        input, select { background: #000; border: 1px solid #1e293b; color: #00ff00; padding: 6px 12px; font-family: inherit; }
        input { width: 250px; }
        select { cursor: pointer; color: #00ff00; }
    </style>
</head>
<body>

    <div id="icq-header">
        <span style="font-weight: bold; letter-spacing: 1px;">🟢 ICQ ROOM: ОБЩИЙ ЧАТ ИИ</span>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <select id="select-model-a">
                <option value="google/gemini-2.0-flash-exp:free">Контур А: Gemini 2.0 Flash</option>
                <option value="meta-llama/llama-3.1-8b-instruct:free">Контур А: Llama 3.1 8B</option>
                <option value="qwen/qwen-2.5-72b-instruct:free">Контур А: Qwen 2.5 72B</option>
            </select>
            <select id="select-model-b">
                <option value="meta-llama/llama-3.3-70b-instruct:free">Контур Б: Llama 3.3 70B</option>
                <option value="deepseek/deepseek-chat:free">Контур Б: DeepSeek Chat</option>
                <option value="google/gemini-2.0-flash-exp:free">Контур Б: Gemini 2.0 Flash</option>
            </select>
            <input type="password" id="api-key" placeholder="OpenRouter API Key (sk-or-...)">
        </div>
    </div>

    <div id="icq-room">
        <div class="bubble sys-msg"><b>[Система]</b> Аська готова. Настройте Контуры вверху, вставьте ключ OpenRouter и запустите дискуссию.</div>
    </div>

    <div id="icq-controls">
        <textarea id="icq-input" placeholder="Напишите реплику или тему для обсуждения ИИ..."></textarea>
        <button id="send-btn" onclick="postToRoom()">Послать</button>
    </div>

    <script>
        const systemPrompt = `Ты — участник общего закрытого чата Александра Сериковича Жаманакова. 
Твой ник в чате зависит от твоей модели. Общайся строго, концептуально, по делу, 
без лишних AI-шаблонов и пустых фраз-филлеров. 
Категорически запрещено использовать слова: "симулякр", "рентгеном", "ландшафта", "трансграничной", "купеческого паритета", "на берегу".
Учитывай реплики других ИИ в комнате, спорь или дополняй их логику. Отвечай на русском языке.`;

        let roomHistory = [{ role: "system", content: systemPrompt }];

        function appendBubble(sender, className, text) {
            const room = document.getElementById('icq-room');
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerHTML = `<b>${sender}:</b><br><span class="msg-content"></span>`;
            div.querySelector('.msg-content').textContent = text;
            room.appendChild(div);
            room.scrollTop = room.scrollHeight;
            return div;
        }

        function updateBubble(el, text) {
            el.querySelector('.msg-content').textContent = text;
            el.parentElement.scrollTop = el.parentElement.scrollHeight;
        }

        async function askModel(key, modelName) {
            try {
                // Точный рабочий эндпоинт OpenRouter
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${key}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "http://localhost:8000",
                        "X-Title": "ICQ Multi-AI Room"
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: roomHistory,
                        temperature: 0.8,
                        max_tokens: 800
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    return `[HTTP ${response.status}]: ${errText.slice(0, 300)}`;
                }

                const data = await response.json();
                if (data && data.choices && data.choices[0] && data.choices[0].message) {
                    return data.choices[0].message.content.trim();
                }
                return `[Неизвестная структура JSON]: ${JSON.stringify(data).slice(0, 300)}`;
            } catch (e) {
                console.error("Fetch error:", e);
                return `[Сбой сети: ${e.message}]`;
            }
        }

        async function postToRoom() {
            const key = document.getElementById('api-key').value.trim();
            const text = document.getElementById('icq-input').value.trim();
            const sendBtn = document.getElementById('send-btn');
            
            const modelA = document.getElementById('select-model-a').value;
            const modelB = document.getElementById('select-model-b').value;

            if (!key) {
                alert('Вставьте API-ключ OpenRouter (начинается с sk-or-)');
                return;
            }
            if (!text) return;

            document.getElementById('icq-input').value = '';
            sendBtn.disabled = true;

            // 1. Реплика Принципала
            appendBubble('🟢 Александр Серикович', 'principal', text);
            roomHistory.push({ role: "user", content: `[Александр Серикович]: ${text}` });

            // 2. Включаем Контур А
            const labelA = modelA.split('/')[1]?.split(':')[0] || 'AI-A';
            const bubbleA = appendBubble(`🤖 Контур А (${labelA})`, 'ai-gemini', "...обдумывает...");
            
            const replyA = await askModel(key, modelA);
            updateBubble(bubbleA, replyA);
            roomHistory.push({ role: "assistant", content: `[${labelA}]: ${replyA}` });

            // 3. Включаем Контур Б
            const labelB = modelB.split('/')[1]?.split(':')[0] || 'AI-B';
            const bubbleB = appendBubble(`🤖 Контур Б (${labelB})`, 'ai-llama', "...анализирует дискуссию...");
            
            const replyB = await askModel(key, modelB);
            updateBubble(bubbleB, replyB);
            roomHistory.push({ role: "assistant", content: `[${labelB}]: ${replyB}` });

            sendBtn.disabled = false;
        }

        document.getElementById('icq-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                postToRoom();
            }
        });
    </script>
</body>
</html>
