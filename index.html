<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICQ Multi-AI Chat Room</title>
    <style>
        body { margin: 0; background: #040d1a; color: #00ff00; font-family: "Courier New", monospace; display: flex; flex-direction: column; height: 100vh; }
        #icq-header { background: #020813; border-bottom: 2px solid #00ff00; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        #icq-room { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .bubble { padding: 12px 16px; border-radius: 4px; max-width: 85%; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
        .principal { background: #002244; color: #ffffff; border-left: 4px solid #0088ff; align-self: flex-end; }
        .ai-gemini { background: #0b1d12; color: #a3e635; border-left: 4px solid #22c55e; align-self: flex-start; }
        .ai-llama { background: #1c1917; color: #fb923c; border-left: 4px solid #ea580c; align-self: flex-start; }
        #icq-controls { background: #020813; border-top: 2px solid #1e293b; padding: 15px 20px; display: flex; gap: 15px; }
        textarea { flex: 1; height: 44px; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; resize: none; font-family: inherit; font-size: 15px; }
        textarea:focus { outline: none; box-shadow: 0 0 10px #00ff00; }
        button { background: #00ff00; color: #000; border: none; font-weight: bold; padding: 0 25px; cursor: pointer; font-family: inherit; text-transform: uppercase; }
        button:hover { background: #33ff33; box-shadow: 0 0 10px #00ff00; }
        input { background: #000; border: 1px solid #1e293b; color: #00ff00; padding: 6px 12px; width: 250px; font-family: inherit; }
    </style>
</head>
<body>

    <div id="icq-header">
        <span style="font-weight: bold; letter-spacing: 1px;">🟢 ICQ ROOM: ОБЩИЙ ЧАТ ИИ</span>
        <input type="password" id="api-key" placeholder="Пароль доступа (OpenRouter Key)">
    </div>

    <div id="icq-room">
        <div class="bubble ai-gemini" style="border: none; background: transparent;"><b>[Система]</b> Аська запущена. Контур А (Gemini) и Контур Б (Llama) вошли в комнату. Введите ваш ключ доступа OpenRouter вверху и отправьте первую тему.</div>
    </div>

    <div id="icq-controls">
        <textarea id="icq-input" placeholder="Напишите реплику или тему для обсуждения ИИ..."></textarea>
        <button onclick="postToRoom()">Послать</button>
    </div>

    <script>
        const systemPrompt = `Ты — участник общего закрытого чата Александра Сериковича Жаманакова. Твой ник в чате зависит от твоей модели. Общайся строго, концептуально, по делу, без лишних AI-шаблонов. Учитывай реплики других ИИ в комнате, спорь или дополняй их логику.`;
        
        let roomHistory = [{ role: "system", content: systemPrompt }];

        async function postToRoom() {
            const key = document.getElementById('api-key').value.trim();
            const text = document.getElementById('icq-input').value.trim();
            if (!key) { alert('Вставьте API-ключ!'); return; }
            if (!text) return;

            document.getElementById('icq-input').value = '';
            
            // 1. Публикация реплики Принципала в общую комнату
            appendBubble('🟢 Александр Серикович', 'principal', text);
            roomHistory.push({ role: "user", content: `[Александр Серикович]: ${text}` });

            // 2. Включаем Контур А (Gemini 2.5)
            appendBubble('🤖 Контур А (Gemini)', 'ai-gemini', "...обдумывает задачу...");
            const replyGemini = await askModel(key, "google/gemini-2.5-flash");
            updateLastBubble('🤖 Контур А (Gemini)', 'ai-gemini', replyGemini);
            roomHistory.push({ role: "assistant", content: `[Gemini]: ${replyGemini}` });

            // 3. Включаем Контур Б (Llama 3), передавая ему контекст, включая ответ Gemini
            appendBubble('🤖 Контур Б (Llama)', 'ai-llama', "...анализирует реплику Gemini...");
            const replyLlama = await askModel(key, "meta-llama/llama-3-8b-instruct:free");
            updateLastBubble('🤖 Контур Б (Llama)', 'ai-llama', replyLlama);
            roomHistory.push({ role: "assistant", content: `[Llama]: ${replyLlama}` });
        }

        function appendBubble(sender, className, text) {
            const room = document.getElementById('icq-room');
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            div.innerHTML = `<b>${sender}:</b><br><span class="msg-content">${text}</span>`;
            room.appendChild(div);
            room.scrollTop = room.scrollHeight;
        }

        function updateLastBubble(sender, className, text) {
            const room = document.getElementById('icq-room');
            const lastBubble = room.lastElementChild;
            if (lastBubble) {
                lastBubble.querySelector('.msg-content').textContent = text;
            }
            room.scrollTop = room.scrollHeight;
        }

        async function askModel(key, modelName) {
            try {
                const response = await fetch("https://vllm.site", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ model: modelName, messages: roomHistory })
                });
                const data = await response.json();
                if (data.choices && data.choices.message && data.choices.message.content) {
                    return data.choices.message.content.strip || data.choices.message.content;
                }
                return "...молчание в эфире (неверный формат данных)...";
            } catch (e) {
                return "[Сбой линии связи со шлюзом]";
            }
        }
    </script>
</body>
</html>
